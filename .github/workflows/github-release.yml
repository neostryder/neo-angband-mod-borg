# Create the GitHub Release that the Ledger reads whenever a version is tagged.
# This mod is distributed directly from the repository, so there is no build
# artifact to attach: the exact CHANGELOG.md section is the release note.
name: GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Extract changelog notes
        run: node .github/scripts/release-notes.mjs "${{ github.ref_name }}" release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          if [[ "$version" == 0.* ]]; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Neo Angband: Borg $version" --notes-file release-notes.md --prerelease --verify-tag
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Neo Angband: Borg $version" --notes-file release-notes.md --verify-tag
          fi
